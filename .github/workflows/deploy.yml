# Upload the site to InfinityFree every time main is pushed to GitHub.
#
# One-time setup on GitHub: repository > Settings > Secrets and variables > Actions >
# New repository secret, three times:
#   FTP_SERVER    ftpupload.net         (InfinityFree control panel > FTP Details > FTP Hostname)
#   FTP_USERNAME  if0_XXXXXXXX          (FTP Username)
#   FTP_PASSWORD  your hosting password (FTP Password)
#
# Only changed files are uploaded. Nothing on the server is deleted, so
# config/config.local.php and the uploaded photos stay where they are.
# Database changes run by themselves on the first visit after the upload.
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Waiting for the FTP secrets
        if: env.FTP_SERVER == ''
        run: echo "::notice::Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in Settings > Secrets and variables > Actions, then run this again."

      - name: Get the code
        if: env.FTP_SERVER != ''
        uses: actions/checkout@v4

      - name: Upload changed files to htdocs
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
